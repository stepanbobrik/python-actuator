[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-actuator"
version = "0.1.1"
authors = [
    { name = "Stepan Bobrik" },
]
description = "Spring Boot-compatible health checks for Python applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/stepanbobrik/python-actuator"
Issues = "https://github.com/stepanbobrik/python-actuator/issues"
Security = "https://github.com/stepanbobrik/python-actuator/blob/master/SECURITY.md"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "reuse[charset-normalizer]>=6.2.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "wemake-python-styleguide>=1.6.2",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_actuator = ["py.typed"]
